<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Calorias</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Contador de Calorias</h1>

    <!-- escolher dia -->
    <div>
        <label for="dia">Escolha o dia:</label>
        <select id="dia">
            <option value="segunda">Segunda</option>
            <option value="terça">Terça</option>
            <option value="quarta">Quarta</option>
            <option value="quinta">Quinta</option>
            <option value="sexta">Sexta</option>
            <option value="sabado">Sábado</option>
            <option value="domingo">Domingo</option>
        </select>
    </div>

    <!-- quantidade -->
    <div>
        <label for="calorias">Calorias:</label>
        <input type="number" id="calorias" placeholder="Digite as calorias">
    </div>

    <!-- botões -->
    
       <button id="btnAdicionar"class="Adicionar">Adicionar</button>
        <button id="btnRemover"class="Remover">Remover</button>
    

    <!-- total semanal -->
    <h2>Total semanal: <span id="totalSemanal">0</span> kcal</h2>

    <!-- lista dos dias -->
    <h2>Calorias por dia</h2>
    <ul id="listaDias">
        <li>Segunda: <span id="segunda">0</span> kcal</li>
        <li>Terça: <span id="terca">0</span> kcal</li>
        <li>Quarta: <span id="quarta">0</span> kcal</li>
        <li>Quinta: <span id="quinta">0</span> kcal</li>
        <li>Sexta: <span id="sexta">0</span> kcal</li>
        <li>Sábado: <span id="sabado">0</span> kcal</li>
        <li>Domingo: <span id="domingo">0</span> kcal</li>
    </ul>

    <script src="script.js"></script>
    
</body>
</html>
